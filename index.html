<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irish Summer Camps</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Icons
    const Search = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    );

    const MapPin = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    );

    const DollarSign = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    );

    const Users = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const ExternalLink = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    );

    const Heart = ({ size = 24, color = "currentColor", filled = false, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : "none"} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    );

    const Share2 = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    );

    const X = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const Plus = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );

    const Check = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );

    const IrishSummerCamps = () => {
      const [filters, setFilters] = useState({
        minAge: '',
        maxPrice: '',
        location: '',
        searchTerm: '',
        foodFilter: ''
      });
      
      const [camps, setCamps] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [favorites, setFavorites] = useState([]);
      const [showSubmitModal, setShowSubmitModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [selectedCampForShare, setSelectedCampForShare] = useState(null);
      const [viewMode, setViewMode] = useState('browse'); // 'browse', 'favorites', 'compare'
      const [compareList, setCompareList] = useState([]);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      // Load favorites from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('favoriteCamps');
        if (saved) {
          setFavorites(JSON.parse(saved));
        }
      }, []);

      // Load camps (static JSON on GitHub Pages; optional API when deployed with backend)
      useEffect(() => {
        const path = window.location.pathname;
        const directory =
          path.includes('.html') ? path.replace(/[^/]+$/, '') :
          path.endsWith('/') ? path : path + '/';
        const campsUrl = new URL('camps.json', window.location.origin + directory).href;
        const apiUrl = new URL('/api/camps', window.location.origin).href;

        const normalize = (raw) => {
          const arr = Array.isArray(raw) ? raw : [];
          return arr.map((camp, index) => ({
            ...camp,
            id: camp.id != null ? camp.id : `camp-${index}`,
          }));
        };

        fetch(campsUrl)
          .then(res => {
            if (res.ok) return res.json();
            return fetch(apiUrl).then(r2 => {
              if (!r2.ok) throw new Error('Failed to load camps');
              return r2.json();
            });
          })
          .then(data => {
            setCamps(normalize(data));
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const counties = useMemo(() => {
        return [...new Set(camps.map(camp => camp.county))].sort();
      }, [camps]);

      const getTypeEmoji = (type) => {
        const emojiMap = {
          'sports': '⚽',
          'art': '🎨',
          'music': '🎵',
          'tech': '💻',
          'science': '🔬',
          'adventure': '🏕️',
          'language': '📚',
          'drama': '🎭',
          'dance': '💃',
          'coding': '👨‍💻'
        };
        const typeLower = (type || '').toLowerCase();
        for (const [key, emoji] of Object.entries(emojiMap)) {
          if (typeLower.includes(key)) return emoji;
        }
        return '🎪';
      };

      const filteredCamps = useMemo(() => {
        let result = camps;
        
        if (viewMode === 'favorites') {
          result = camps.filter(camp => favorites.includes(camp.id));
        }

        return result.filter(camp => {
          const matchesAge = !filters.minAge || (camp.ageMin && camp.ageMin <= parseInt(filters.minAge));
          const matchesPrice = !filters.maxPrice || (camp.priceEur && camp.priceEur <= parseInt(filters.maxPrice));
          const matchesLocation = !filters.location || camp.county === filters.location;
          const matchesFood = !filters.foodFilter || 
            (filters.foodFilter === 'yes' && camp.foodProvided) ||
            (filters.foodFilter === 'no' && !camp.foodProvided);
          const matchesSearch = !filters.searchTerm || 
            camp.name.toLowerCase().includes(filters.searchTerm.toLowerCase()) ||
            (camp.type && camp.type.toLowerCase().includes(filters.searchTerm.toLowerCase())) ||
            (camp.locationDetail && camp.locationDetail.toLowerCase().includes(filters.searchTerm.toLowerCase()));
          
          return matchesAge && matchesPrice && matchesLocation && matchesFood && matchesSearch;
        });
      }, [filters, camps, viewMode, favorites]);

      const handleFilterChange = (field, value) => {
        setFilters(prev => ({ ...prev, [field]: value }));
      };

      const clearFilters = () => {
        setFilters({
          minAge: '',
          maxPrice: '',
          location: '',
          searchTerm: '',
          foodFilter: ''
        });
      };

      const toggleFavorite = (campId) => {
        setFavorites(prev => {
          const newFavorites = prev.includes(campId)
            ? prev.filter(id => id !== campId)
            : [...prev, campId];
          localStorage.setItem('favoriteCamps', JSON.stringify(newFavorites));
          return newFavorites;
        });
      };

      const toggleCompare = (campId) => {
        setCompareList(prev => {
          if (prev.includes(campId)) {
            return prev.filter(id => id !== campId);
          }
          if (prev.length >= 3) {
            alert('You can compare up to 3 camps at a time');
            return prev;
          }
          return [...prev, campId];
        });
      };

      const shareCamp = (camp, method) => {
        const url = `${window.location.origin}?camp=${camp.id}`;
        const text = `Check out ${camp.name} - ${camp.county}`;
        
        if (method === 'whatsapp') {
          window.open(`https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`, '_blank');
        } else if (method === 'email') {
          window.location.href = `mailto:?subject=${encodeURIComponent(camp.name)}&body=${encodeURIComponent(text + '\n\n' + url)}`;
        } else if (method === 'copy') {
          navigator.clipboard.writeText(url);
          alert('Link copied to clipboard!');
        }
        setShowShareModal(false);
      };

      const submitCamp = async (formData) => {
        try {
          const response = await fetch('/api/submissions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          
          if (response.ok) {
            setSubmitSuccess(true);
            setTimeout(() => {
              setShowSubmitModal(false);
              setSubmitSuccess(false);
            }, 3000);
          } else {
            alert('Submission failed. Please try again.');
          }
        } catch (error) {
          alert('Error submitting camp: ' + error.message);
        }
      };

      const compareCamps = useMemo(() => {
        return camps.filter(camp => compareList.includes(camp.id));
      }, [compareList, camps]);

      if (loading) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>☀️</div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '2rem',
                color: '#FF6B35'
              }}>
                Loading camps...
              </h2>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif',
            padding: '20px'
          }}>
            <div style={{
              background: 'white',
              borderRadius: '25px',
              padding: '40px',
              border: '4px solid #FF6B6B',
              textAlign: 'center',
              maxWidth: '500px'
            }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>😕</div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '1.8rem',
                color: '#2D3142',
                margin: '0 0 10px 0'
              }}>
                Oops! Something went wrong
              </h2>
              <p style={{ color: '#666', fontSize: '1rem' }}>{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
          fontFamily: '"Nunito", sans-serif',
          padding: '20px'
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
            
            @keyframes float {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-10px); }
            }
            
            @keyframes slideIn {
              from { opacity: 0; transform: translateY(20px); }
              to { opacity: 1; transform: translateY(0); }
            }
            
            .camp-card {
              animation: slideIn 0.5s ease-out forwards;
              opacity: 0;
            }
            
            .camp-card:nth-child(1) { animation-delay: 0.05s; }
            .camp-card:nth-child(2) { animation-delay: 0.1s; }
            .camp-card:nth-child(3) { animation-delay: 0.15s; }
            .camp-card:nth-child(4) { animation-delay: 0.2s; }
            .camp-card:nth-child(5) { animation-delay: 0.25s; }
            .camp-card:nth-child(6) { animation-delay: 0.3s; }
          `}</style>

          {/* Header */}
          <div style={{
            textAlign: 'center',
            marginBottom: '40px'
          }}>
            <h1 style={{
              fontFamily: '"Fredoka One", cursive',
              fontSize: 'clamp(2rem, 8vw, 4rem)',
              color: '#FF6B35',
              margin: '0 0 10px 0',
              textShadow: '4px 4px 0 #FFD93D, 8px 8px 0 rgba(0,0,0,0.1)',
              letterSpacing: '2px'
            }}>
              ☀️ Irish Summer Camps
            </h1>
            <p style={{
              fontSize: 'clamp(1rem, 3vw, 1.3rem)',
              color: '#2D3142',
              fontWeight: '600',
              margin: '0 0 20px 0'
            }}>
              Find the perfect adventure for your child! 🎪
            </p>

            {/* View Toggle + Submit Button */}
            <div style={{
              display: 'flex',
              justifyContent: 'center',
              gap: '10px',
              flexWrap: 'wrap',
              marginBottom: '20px'
            }}>
              <button
                onClick={() => setViewMode('browse')}
                style={{
                  padding: '12px 24px',
                  backgroundColor: viewMode === 'browse' ? '#FF6B35' : 'white',
                  color: viewMode === 'browse' ? 'white' : '#FF6B35',
                  border: '3px solid #FF6B35',
                  borderRadius: '15px',
                  fontSize: '1rem',
                  fontWeight: '700',
                  cursor: 'pointer',
                  fontFamily: 'inherit'
                }}
              >
                🔍 Browse Camps
              </button>
              <button
                onClick={() => setViewMode('favorites')}
                style={{
                  padding: '12px 24px',
                  backgroundColor: viewMode === 'favorites' ? '#FF6B35' : 'white',
                  color: viewMode === 'favorites' ? 'white' : '#FF6B35',
                  border: '3px solid #FF6B35',
                  borderRadius: '15px',
                  fontSize: '1rem',
                  fontWeight: '700',
                  cursor: 'pointer',
                  fontFamily: 'inherit',
                  position: 'relative'
                }}
              >
                ❤️ Saved ({favorites.length})
              </button>
              {compareList.length > 0 && (
                <button
                  onClick={() => setViewMode('compare')}
                  style={{
                    padding: '12px 24px',
                    backgroundColor: viewMode === 'compare' ? '#FF6B35' : 'white',
                    color: viewMode === 'compare' ? 'white' : '#FF6B35',
                    border: '3px solid #FF6B35',
                    borderRadius: '15px',
                    fontSize: '1rem',
                    fontWeight: '700',
                    cursor: 'pointer',
                    fontFamily: 'inherit'
                  }}
                >
                  ⚖️ Compare ({compareList.length})
                </button>
              )}
            </div>

            <button
              onClick={() => setShowSubmitModal(true)}
              style={{
                padding: '14px 28px',
                backgroundColor: '#4CAF50',
                color: 'white',
                border: 'none',
                borderRadius: '15px',
                fontSize: '1.1rem',
                fontWeight: '700',
                cursor: 'pointer',
                fontFamily: 'inherit',
                boxShadow: '0 4px 15px rgba(76, 175, 80, 0.3)',
                display: 'inline-flex',
                alignItems: 'center',
                gap: '8px'
              }}
            >
              <Plus size={20} />
              Submit Your Camp
            </button>
          </div>

          {/* Compare View */}
          {viewMode === 'compare' && compareCamps.length > 0 && (
            <div style={{
              maxWidth: '1400px',
              margin: '0 auto 40px',
              background: 'white',
              borderRadius: '25px',
              padding: '30px',
              border: '4px solid #FFD93D',
              overflowX: 'auto'
            }}>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '1.8rem',
                color: '#FF6B35',
                marginTop: '0',
                marginBottom: '25px'
              }}>
                ⚖️ Comparing {compareCamps.length} Camps
              </h2>
              <table style={{
                width: '100%',
                borderCollapse: 'collapse',
                minWidth: '600px'
              }}>
                <thead>
                  <tr style={{ backgroundColor: '#FFF5E1' }}>
                    <th style={{ padding: '15px', textAlign: 'left', fontWeight: '700', color: '#2D3142' }}>Feature</th>
                    {compareCamps.map(camp => (
                      <th key={camp.id} style={{ padding: '15px', textAlign: 'left', fontWeight: '700', color: '#2D3142' }}>
                        {camp.name}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>County</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>{camp.county}</td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Type</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>{camp.type || '-'}</td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Age Range</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>
                        {camp.ageMin && camp.ageMax ? `${camp.ageMin}-${camp.ageMax}` : '-'}
                      </td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Price</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '700', color: '#FF6B35' }}>
                        {camp.priceEur ? `€${camp.priceEur}` : 'Contact'}
                      </td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Hours</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>{camp.hours || '-'}</td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Food</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>
                        {camp.foodProvided ? '✅ Yes' : '❌ No'}
                      </td>
                    ))}
                  </tr>
                  <tr>
                    <td style={{ padding: '12px', borderTop: '2px solid #E8E8E8', fontWeight: '600' }}>Website</td>
                    {compareCamps.map(camp => (
                      <td key={camp.id} style={{ padding: '12px', borderTop: '2px solid #E8E8E8' }}>
                        {camp.sourceUrl ? (
                          <a href={camp.sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color: '#FF6B35', fontWeight: '600' }}>
                            Visit
                          </a>
                        ) : '-'}
                      </td>
                    ))}
                  </tr>
                </tbody>
              </table>
              <button
                onClick={() => setCompareList([])}
                style={{
                  marginTop: '20px',
                  padding: '10px 20px',
                  backgroundColor: '#FF6B35',
                  color: 'white',
                  border: 'none',
                  borderRadius: '12px',
                  fontSize: '0.9rem',
                  fontWeight: '700',
                  cursor: 'pointer',
                  fontFamily: 'inherit'
                }}
              >
                Clear Comparison
              </button>
            </div>
          )}

          {/* Filters Section (only in browse/favorites mode) */}
          {viewMode !== 'compare' && (
            <div style={{
              maxWidth: '1200px',
              margin: '0 auto 40px',
              background: 'white',
              borderRadius: '25px',
              padding: '30px',
              boxShadow: '0 10px 40px rgba(0,0,0,0.15)',
              border: '4px solid #FFD93D'
            }}>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '1.8rem',
                color: '#FF6B35',
                marginTop: '0',
                marginBottom: '25px',
                display: 'flex',
                alignItems: 'center',
                gap: '10px'
              }}>
                🔍 Find Your Camp
              </h2>

              <div style={{ marginBottom: '20px', position: 'relative' }}>
                <Search size={20} style={{
                  position: 'absolute',
                  left: '15px',
                  top: '50%',
                  transform: 'translateY(-50%)',
                  color: '#999'
                }} />
                <input
                  type="text"
                  placeholder="Search by camp name or type..."
                  value={filters.searchTerm}
                  onChange={(e) => handleFilterChange('searchTerm', e.target.value)}
                  style={{
                    width: '100%',
                    padding: '15px 15px 15px 45px',
                    fontSize: '1rem',
                    border: '3px solid #FFD93D',
                    borderRadius: '15px',
                    fontFamily: 'inherit',
                    outline: 'none',
                    transition: 'all 0.3s',
                    boxSizing: 'border-box'
                  }}
                  onFocus={(e) => e.target.style.borderColor = '#FF6B35'}
                  onBlur={(e) => e.target.style.borderColor = '#FFD93D'}
