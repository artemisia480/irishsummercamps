<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irish Summer Camps</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Lucide Icons as inline SVG components
    const Search = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    );

    const MapPin = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    );

    const DollarSign = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    );

    const Users = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const ExternalLink = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    );

    const IrishSummerCamps = () => {
      const [filters, setFilters] = useState({
        minAge: '',
        maxPrice: '',
        location: '',
        searchTerm: '',
        foodFilter: ''
      });
      
      const [camps, setCamps] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('/api/camps')
          .then(res => {
            if (!res.ok) throw new Error('Failed to fetch camps');
            return res.json();
          })
          .then(data => {
            setCamps(data);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const counties = useMemo(() => {
        return [...new Set(camps.map(camp => camp.county))].sort();
      }, [camps]);

      const getTypeEmoji = (type) => {
        const emojiMap = {
          'sports': '⚽',
          'art': '🎨',
          'music': '🎵',
          'tech': '💻',
          'science': '🔬',
          'adventure': '🏕️',
          'language': '📚',
          'drama': '🎭',
          'dance': '💃',
          'coding': '👨'
        };
        const typeLower = (type || '').toLowerCase();
        for (const [key, emoji] of Object.entries(emojiMap)) {
          if (typeLower.includes(key)) return emoji;
        }
        return '🎪';
      };

      const filteredCamps = useMemo(() => {
        return camps.filter(camp => {
          const matchesAge = !filters.minAge || (camp.ageMin && camp.ageMin <= parseInt(filters.minAge));
          const matchesPrice = !filters.maxPrice || (camp.priceEur && camp.priceEur <= parseInt(filters.maxPrice));
          const matchesLocation = !filters.location || camp.county === filters.location;
          const matchesFood = !filters.foodFilter || 
            (filters.foodFilter === 'yes' && camp.foodProvided) ||
            (filters.foodFilter === 'no' && !camp.foodProvided);
          const matchesSearch = !filters.searchTerm || 
            camp.name.toLowerCase().includes(filters.searchTerm.toLowerCase()) ||
            (camp.type && camp.type.toLowerCase().includes(filters.searchTerm.toLowerCase())) ||
            (camp.locationDetail && camp.locationDetail.toLowerCase().includes(filters.searchTerm.toLowerCase()));
          
          return matchesAge && matchesPrice && matchesLocation && matchesFood && matchesSearch;
        });
      }, [filters, camps]);

      const handleFilterChange = (field, value) => {
        setFilters(prev => ({ ...prev, [field]: value }));
      };

      const clearFilters = () => {
        setFilters({
          minAge: '',
          maxPrice: '',
          location: '',
          searchTerm: '',
          foodFilter: ''
        });
      };

      if (loading) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>
                ☀️
              </div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '2rem',
                color: '#FF6B35'
              }}>
                Loading camps...
              </h2>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif',
            padding: '20px'
          }}>
            <div style={{
              background: 'white',
              borderRadius: '25px',
              padding: '40px',
              border: '4px solid #FF6B6B',
              textAlign: 'center',
              maxWidth: '500px'
            }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>😕</div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '1.8rem',
                color: '#2D3142',
                margin: '0 0 10px 0'
              }}>
                Oops! Something went wrong
              </h2>
              <p style={{ color: '#666', fontSize: '1rem' }}>{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
          fontFamily: '"Nunito", sans-serif',
          padding: '20px'
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
            
            @keyframes float {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-10px); }
            }
            
            @keyframes slideIn {
              from { 
                opacity: 0; 
                transform: translateY(20px);
              }
              to { 
                opacity: 1; 
                transform: translateY(0);
              }
            }
            
            .camp-card {
              animation: slideIn 0.5s ease-out forwards;
              opacity: 0;
            }
            
            .camp-card:nth-child(1) { animation-delay: 0.05s; }
            .camp-card:nth-child(2) { animation-delay: 0.1s; }
            .camp-card:nth-child(3) { animation-delay: 0.15s; }
            .camp-card:nth-child(4) { animation-delay: 0.2s; }
            .camp-card:nth-child(5) { animation-delay: 0.25s; }
            .camp-card:nth-child(6) { animation-delay: 0.3s; }
          `}</style>

          <div style={{
            textAlign: 'center',
            marginBottom: '40px'
          }}>
            <h1 style={{
              fontFamily: '"Fredoka One", cursive',
              fontSize: 'clamp(2rem, 8vw, 4rem)',
              color: '#FF6B35',
              margin: '0 0 10px 0',
              textShadow: '4px 4px 0 #FFD93D, 8px 8px 0 rgba(0,0,0,0.1)',
              letterSpacing: '2px'
            }}>
              ☀️ Irish Summer Camps
            </h1>
            <p style={{
              fontSize: 'clamp(1rem, 3vw, 1.3rem)',
              color: '#2D3142',
              fontWeight: '600',
              margin: '0'
            }}>
              Find the perfect adventure for your child! 🎪
            </p>
          </div>

          <div style={{
            maxWidth: '1200px',
            margin: '0 auto 40px',
            background: 'white',
            borderRadius: '25px',
            padding: '30px',
            boxShadow: '0 10px 40px rgba(0,0,0,0.15)',
            border: '4px solid #FFD93D'
          }}>
            <h2 style={{
              fontFamily: '"Fredoka One", cursive',
              fontSize: '1.8rem',
              color: '#FF6B35',
              marginTop: '0',
              marginBottom: '25px',
              display: 'flex',
              alignItems: 'center',
              gap: '10px'
            }}>
              🔍 Find Your Camp
            </h2>

            <div style={{ marginBottom: '20px', position: 'relative' }}>
              <Search size={20} style={{
                position: 'absolute',
                left: '15px',
                top: '50%',
                transform: 'translateY(-50%)',
                color: '#999'
              }} />
              <input
                type="text"
                placeholder="Search by camp name or type..."
                value={filters.searchTerm}
                onChange={(e) => handleFilterChange('searchTerm', e.target.value)}
                style={{
                  width: '100%',
                  padding: '15px 15px 15px 45px',
                  fontSize: '1rem',
                  border: '3px solid #FFD93D',
                  borderRadius: '15px',
                  fontFamily: 'inherit',
                  outline: 'none',
                  transition: 'all 0.3s',
                  boxSizing: 'border-box'
                }}
                onFocus={(e) => e.target.style.borderColor = '#FF6B35'}
                onBlur={(e) => e.target.style.borderColor = '#FFD93D'}
              />
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))',
              gap: '15px',
              marginBottom: '20px'
            }}>
              <div>
                <label style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  fontWeight: '700',
                  color: '#2D3142',
                  marginBottom: '8px',
                  fontSize: '0.95rem'
                }}>
                  <Users size={18} color="#FF6B35" />
                  Minimum Age
                </label>
                <input
                  type="number"
                  placeholder="Any age"
                  value={filters.minAge}
                  onChange={(e) => handleFilterChange('minAge', e.target.value)}
                  style={{
                    width: '100%',
                    padding: '12px',
                    fontSize: '1rem',
                    border: '3px solid #E8E8E8',
                    borderRadius: '12px',
                    fontFamily: 'inherit',
                    outline: 'none',
                    boxSizing: 'border-box'
                  }}
                />
              </div>

              <div>
                <label style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  fontWeight: '700',
                  color: '#2D3142',
                  marginBottom: '8px',
                  fontSize: '0.95rem'
                }}>
                  <DollarSign size={18} color="#FF6B35" />
                  Max Price (€)
                </label>
                <input
                  type="number"
                  placeholder="Any price"
                  value={filters.maxPrice}
                  onChange={(e) => handleFilterChange('maxPrice', e.target.value)}
                  style={{
                    width: '100%',
                    padding: '12px',
                    fontSize: '1rem',
                    border: '3px solid #E8E8E8',
                    borderRadius: '12px',
                    fontFamily: 'inherit',
                    outline: 'none',
                    boxSizing: 'border-box'
                  }}
                />
              </div>

              <div>
                <label style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  fontWeight: '700',
                  color: '#2D3142',
                  marginBottom: '8px',
                  fontSize: '0.95rem'
                }}>
                  <MapPin size={18} color="#FF6B35" />
                  County
                </label>
                <select
                  value={filters.location}
                  onChange={(e) => handleFilterChange('location', e.target.value)}
                  style={{
                    width: '100%',
                    padding: '12px',
                    fontSize: '1rem',
                    border: '3px solid #E8E8E8',
                    borderRadius: '12px',
                    fontFamily: 'inherit',
                    outline: 'none',
                    backgroundColor: 'white',
                    cursor: 'pointer',
                    boxSizing: 'border-box'
                  }}
                >
                  <option value="">All Counties</option>
                  {counties.map(county => (
                    <option key={county} value={county}>{county}</option>
                  ))}
                </select>
              </div>

              <div>
                <label style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '8px',
                  fontWeight: '700',
                  color: '#2D3142',
                  marginBottom: '8px',
                  fontSize: '0.95rem'
                }}>
                  🍽️ Food
                </label>
                <select
                  value={filters.foodFilter}
                  onChange={(e) => handleFilterChange('foodFilter', e.target.value)}
                  style={{
                    width: '100%',
                    padding: '12px',
                    fontSize: '1rem',
                    border: '3px solid #E8E8E8',
                    borderRadius: '12px',
                    fontFamily: 'inherit',
                    outline: 'none',
                    backgroundColor: 'white',
                    cursor: 'pointer',
                    boxSizing: 'border-box'
                  }}
                >
                  <option value="">Any</option>
                  <option value="yes">Food provided</option>
                  <option value="no">No food</option>
                </select>
              </div>
            </div>

            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              flexWrap: 'wrap',
              gap: '10px'
            }}>
              <div style={{
                fontSize: '0.95rem',
                color: '#666',
                fontWeight: '600'
              }}>
                Showing {filteredCamps.length} of {camps.length} camps
              </div>
              {(filters.minAge || filters.maxPrice || filters.location || filters.searchTerm || filters.foodFilter) && (
                <button
                  onClick={clearFilters}
                  style={{
                    padding: '10px 20px',
                    backgroundColor: '#FF6B35',
                    color: 'white',
                    border: 'none',
                    borderRadius: '12px',
                    fontSize: '0.9rem',
                    fontWeight: '700',
                    cursor: 'pointer',
                    transition: 'all 0.3s',
                    fontFamily: 'inherit'
                  }}
                >
                  Clear Filters
                </button>
              )}
            </div>
          </div>

          <div style={{
            maxWidth: '1200px',
            margin: '0 auto'
          }}>
            {filteredCamps.length === 0 ? (
              <div style={{
                textAlign: 'center',
                padding: '60px 20px',
                background: 'white',
                borderRadius: '25px',
                border: '4px dashed #FFD93D'
              }}>
                <div style={{ fontSize: '4rem', marginBottom: '20px' }}>😕</div>
                <h3 style={{
                  fontFamily: '"Fredoka One", cursive',
                  fontSize: '1.8rem',
                  color: '#2D3142',
                  margin: '0 0 10px 0'
                }}>
                  No camps found
                </h3>
                <p style={{
                  color: '#666',
                  fontSize: '1.1rem'
                }}>
                  Try adjusting your filters to see more options
                </p>
              </div>
            ) : (
              <div style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))',
                gap: '25px',
                marginBottom: '40px'
              }}>
                {filteredCamps.map((camp) => (
                  <div
                    key={camp.id}
                    className="camp-card"
                    style={{
                      background: 'white',
                      borderRadius: '20px',
                      overflow: 'hidden',
                      boxShadow: '0 5px 20px rgba(0,0,0,0.1)',
                      border: '3px solid #FFD93D',
                      transition: 'all 0.3s'
                    }}
                  >
                    <div style={{
                      background: 'linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%)',
                      padding: '30px',
                      textAlign: 'center',
                      fontSize: '4rem'
                    }}>
                      {getTypeEmoji(camp.type)}
                    </div>

                    <div style={{ padding: '20px' }}>
                      <h3 style={{
                        fontFamily: '"Fredoka One", cursive',
                        fontSize: '1.3rem',
                        color: '#2D3142',
                        margin: '0 0 10px 0',
                        lineHeight: '1.3'
                      }}>
                        {camp.name}
                      </h3>

                      <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: '5px',
                        color: '#666',
                        fontSize: '0.95rem',
                        marginBottom: '15px'
                      }}>
                        <MapPin size={16} color="#FF6B35" />
                        <span style={{ fontWeight: '600' }}>
                          {camp.locationDetail ? `${camp.locationDetail}, ${camp.county}` : camp.county}
                        </span>
                      </div>

                      {camp.type && (
                        <div style={{
                          background: '#FFF5E1',
                          padding: '8px 12px',
                          borderRadius: '10px',
                          display: 'inline-block',
                          fontSize: '0.9rem',
                          fontWeight: '600',
                          color: '#FF6B35',
                          border: '2px solid #FFD93D',
                          marginBottom: '15px'
                        }}>
                          {camp.type}
                        </div>
                      )}

                      <div style={{
                        display: 'grid',
                        gridTemplateColumns: '1fr 1fr',
                        gap: '12px',
                        marginBottom: '15px',
                        paddingBottom: '15px',
                        borderBottom: '2px dashed #E8E8E8'
                      }}>
                        {camp.ageMin && camp.ageMax && (
                          <div>
                            <div style={{
                              fontSize: '0.85rem',
                              color: '#999',
                              marginBottom: '3px'
                            }}>
                              Age Range
                            </div>
                            <div style={{
                              fontWeight: '700',
                              color: '#2D3142',
                              fontSize: '1.1rem'
                            }}>
                              {camp.ageMin}-{camp.ageMax}
                            </div>
                          </div>
                        )}
                        {camp.hours && (
                          <div>
                            <div style={{
                              fontSize: '0.85rem',
                              color: '#999',
                              marginBottom: '3px'
                            }}>
                              Hours
                            </div>
                            <div style={{
                              fontWeight: '700',
                              color: '#2D3142',
                              fontSize: '1.1rem'
                            }}>
                              {camp.hours}
                            </div>
                          </div>
                        )}
                      </div>

                      {camp.foodProvided && (
                        <div style={{
                          background: '#E8F5E9',
                          padding: '8px 12px',
                          borderRadius: '10px',
                          fontSize: '0.9rem',
                          fontWeight: '600',
                          color: '#2E7D32',
                          marginBottom: '15px',
                          display: 'inline-block'
                        }}>
                          🍽️ Food provided
                        </div>
                      )}

                      <div style={{
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        marginTop: '15px',
                        paddingTop: '15px',
                        borderTop: '2px dashed #E8E8E8'
                      }}>
                        {camp.priceEur ? (
                          <div style={{
                            fontFamily: '"Fredoka One", cursive',
                            fontSize: '1.8rem',
                            color: '#FF6B35'
                          }}>
                            €{camp.priceEur}
                          </div>
                        ) : (
                          <div style={{
                            fontSize: '0.9rem',
                            color: '#999'
                          }}>
                            Contact for price
                          </div>
                        )}
                        {camp.sourceUrl && (
                          <a
                            href={camp.sourceUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            style={{
                              display: 'flex',
                              alignItems: 'center',
                              gap: '5px',
                              padding: '8px 12px',
                              background: '#FF6B35',
                              color: 'white',
                              borderRadius: '10px',
                              textDecoration: 'none',
                              fontSize: '0.9rem',
                              fontWeight: '700',
                              transition: 'all 0.3s'
                            }}
                          >
                            <ExternalLink size={16} />
                            Website
                          </a>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{
            textAlign: 'center',
            marginTop: '40px',
            padding: '20px',
            color: '#2D3142',
            fontSize: '0.9rem'
          }}>
            <p style={{ margin: '0 0 10px 0' }}>
              <a href="/admin" style={{ color: '#FF6B35', textDecoration: 'none', fontWeight: '700' }}>Admin</a>
              {' • '}
              <a href="/contact.html" style={{ color: '#FF6B35', textDecoration: 'none' }}>Contact</a>
              {' • '}
              <a href="/privacy.html" style={{ color: '#FF6B35', textDecoration: 'none' }}>Privacy</a>
            </p>
            <p style={{ margin: '0', fontWeight: '600' }}>
              🌈 Find your child's perfect summer adventure! 🌈
            </p>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IrishSummerCamps />);
  </script>
</body>
</html>
