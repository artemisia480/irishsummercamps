<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irish Summer Camps</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <meta name="theme-color" content="#FF6B35">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Summer Camps">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-705050BPF6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-705050BPF6');
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    }
    @media (max-width: 768px) {
      #ai-chat-button, #ai-chat-modal { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    /** API origin — uses www domain in production, falls back to Railway URL for local dev. */
    const CAMPS_DB_API_ORIGIN = (window.location.hostname === 'irishsummercamps.ie' || window.location.hostname === 'www.irishsummercamps.ie')
      ? 'https://www.irishsummercamps.ie'
      : 'https://web-production-d5e24.up.railway.app';

    const idMatches = (a, b) => String(a) === String(b);
    const listHasId = (list, campId) => list.some((id) => idMatches(id, campId));

    // Icons
    const Search = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    );

    const MapPin = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    );

    const DollarSign = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
    );

    const Users = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const ExternalLink = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    );

    const Heart = ({ size = 24, color = "currentColor", filled = false, ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : "none"} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    );

    const Share2 = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    );

    const X = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const Plus = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );

    const Check = ({ size = 24, color = "currentColor", ...props }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );

    const IrishSummerCamps = () => {
      const [filters, setFilters] = useState({
        minAge: '',
        maxPrice: '',
        location: '',
        searchTerm: '',
        foodFilter: ''
      });
      
      const [camps, setCamps] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [favorites, setFavorites] = useState([]);
      const [showSubmitModal, setShowSubmitModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [selectedCampForShare, setSelectedCampForShare] = useState(null);
      const [viewMode, setViewMode] = useState('browse'); // 'browse', 'favorites', 'compare'
      const [compareList, setCompareList] = useState([]);
      const [submitSuccess, setSubmitSuccess] = useState(false);
      const [aiFilterActive, setAiFilterActive] = useState(false);

      // Load favorites from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('favoriteCamps');
        if (saved) {
          setFavorites(JSON.parse(saved));
        }
      }, []);

      // Load camps: database API first (local Flask or Railway), then production API, then camps.json fallback
      useEffect(() => {
        const path = window.location.pathname;
        const directory =
          path.includes('.html') ? path.replace(/[^/]+$/, '') :
          path.endsWith('/') ? path : path + '/';
        const campsJsonUrl = new URL('camps.json', window.location.origin + directory).href;
        const sameOriginApi = new URL('/api/camps', window.location.origin).href;
        const railwayApi = `${CAMPS_DB_API_ORIGIN}/api/camps`;

        const normalize = (raw) => {
          const arr = Array.isArray(raw) ? raw : [];
          return arr.map((camp, index) => ({
            ...camp,
            id: camp.id != null ? camp.id : `camp-${index}`,
          }));
        };

        const sortCampsByName = (campsList) =>
          [...campsList].sort((a, b) =>
            (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' })
          );

        const tryFetchCamps = async (url) => {
          const res = await fetch(url);
          if (!res.ok) throw new Error('Failed to load camps');
          return res.json();
        };

        (async () => {
          const urls = [sameOriginApi, railwayApi, campsJsonUrl];
          let lastErr = null;
          for (const url of urls) {
            try {
              const data = await tryFetchCamps(url);
              setCamps(sortCampsByName(normalize(data)));
              setLoading(false);
              return;
            } catch (e) {
              lastErr = e;
            }
          }
          setError((lastErr && lastErr.message) || 'Failed to load camps');
          setLoading(false);
        })();
      }, []);

      const counties = useMemo(() => {
        return [...new Set(camps.map(camp => camp.county))].sort();
      }, [camps]);

      const getTypeEmoji = (type) => {
        const t = (type || '').toLowerCase();
        // Ordered most-specific → least-specific so broader terms don't win early
        if (t.includes('swim') || t.includes('pool') || t.includes('aqua') || t.includes('water sport')) return '🏊';
        if (t.includes('surf') || t.includes('sailing') || t.includes('kayak') || t.includes('canoe') || t.includes('water')) return '🌊';
        if (t.includes('horse') || t.includes('pony') || t.includes('equestrian') || t.includes('riding')) return '🐴';
        if (t.includes('forest') || t.includes('nature') || t.includes('wildlife') || t.includes('garden') || t.includes('eco')) return '🌿';
        if (t.includes('outdoor') || t.includes('adventure') || t.includes('camp') && t.includes('scout')) return '🏕️';
        if (t.includes('dance') || t.includes('ballet') || t.includes('hip hop')) return '💃';
        if (t.includes('drama') || t.includes('theatre') || t.includes('theater') || t.includes('acting')) return '🎭';
        if (t.includes('music') || t.includes('choir') || t.includes('sing') || t.includes('guitar') || t.includes('piano') || t.includes('band') || t.includes('rock')) return '🎵';
        if (t.includes('art') || t.includes('craft') || t.includes('paint') || t.includes('draw') || t.includes('creative')) return '🎨';
        if (t.includes('coding') || t.includes('code') || t.includes('programming') || t.includes('robotics') || t.includes('robot') || t.includes('ai ') || t.includes('lego')) return '🤖';
        if (t.includes('stem') || t.includes('steam') || t.includes('tech') || t.includes('science') || t.includes('vr') || t.includes('3d')) return '🔬';
        if (t.includes('football') || t.includes('soccer')) return '⚽';
        if (t.includes('rugby')) return '🏉';
        if (t.includes('basketball')) return '🏀';
        if (t.includes('tennis')) return '🎾';
        if (t.includes('golf')) return '⛳';
        if (t.includes('gymnastics') || t.includes('acro') || t.includes('cheer')) return '🤸';
        if (t.includes('sport') || t.includes('gaa') || t.includes('multi-activity') || t.includes('multi activity') || t.includes('athletic')) return '🏅';
        if (t.includes('cook') || t.includes('chef') || t.includes('bak')) return '👨‍🍳';
        if (t.includes('language') || t.includes('irish') || t.includes('gaeilge') || t.includes('french') || t.includes('spanish')) return '📚';
        if (t.includes('life skill') || t.includes('leadership') || t.includes('wellbeing') || t.includes('mindful')) return '🌟';
        if (t.includes('film') || t.includes('photo') || t.includes('animation') || t.includes('media')) return '🎬';
        if (t.includes('archaeology') || t.includes('history') || t.includes('museum')) return '🏛️';
        if (t.includes('zoo') || t.includes('farm') || t.includes('animal')) return '🦁';
        return '🎪';
      };

      const filteredCamps = useMemo(() => {
        let result = camps;
        
        if (viewMode === 'favorites') {
          result = camps.filter(camp => listHasId(favorites, camp.id));
        }

        return result.filter(camp => {
          const matchesAge = !filters.minAge || (camp.ageMin && camp.ageMin <= parseInt(filters.minAge));
          const matchesPrice = !filters.maxPrice || (camp.priceEur && camp.priceEur <= parseInt(filters.maxPrice));
          const matchesLocation = !filters.location || (camp.county || '').toLowerCase() === filters.location.toLowerCase();
          const matchesFood = !filters.foodFilter || 
            (filters.foodFilter === 'yes' && camp.foodProvided) ||
            (filters.foodFilter === 'no' && !camp.foodProvided);
          const matchesSearch = !filters.searchTerm || 
            camp.name.toLowerCase().includes(filters.searchTerm.toLowerCase()) ||
            (camp.type && camp.type.toLowerCase().includes(filters.searchTerm.toLowerCase())) ||
            (camp.locationDetail && camp.locationDetail.toLowerCase().includes(filters.searchTerm.toLowerCase()));
          
          return matchesAge && matchesPrice && matchesLocation && matchesFood && matchesSearch;
        });
      }, [filters, camps, viewMode, favorites]);

      const handleFilterChange = (field, value) => {
        setFilters(prev => ({ ...prev, [field]: value }));
      };

      const clearFilters = () => {
        setFilters({
          minAge: '',
          maxPrice: '',
          location: '',
          searchTerm: '',
          foodFilter: ''
        });
        setAiFilterActive(false);
      };

      // Exposed so the plain-JS chat widget can push filter hints into React state
      useEffect(() => {
        window.__aiSetFilters = (hints) => {
          // null means "no change — keep previous value"; explicit value (incl. "") means "set this"
          setFilters(prev => {
            const county    = hints.county    != null ? hints.county    : (prev.location   || '');
            const searchTerm= hints.searchTerm!= null ? hints.searchTerm: (prev.searchTerm || '');
            const minAge    = hints.minAge    != null ? String(hints.minAge)    : (prev.minAge    || '');
            const maxPrice  = hints.maxPrice  != null ? String(hints.maxPrice)  : (prev.maxPrice  || '');
            const foodFilter= hints.foodProvided != null
              ? (hints.foodProvided === true ? 'yes' : hints.foodProvided === false ? 'no' : '')
              : (prev.foodFilter || '');
            const hasFilter = county || searchTerm || minAge || maxPrice || foodFilter;
            if (!hasFilter) return prev;
            setAiFilterActive(true);
            setViewMode('browse');
            return { ...prev, location: county, searchTerm, minAge, maxPrice, foodFilter };
          });
        };
        return () => { delete window.__aiSetFilters; };
      }, []);

      const toggleFavorite = (campId) => {
        setFavorites(prev => {
          const newFavorites = listHasId(prev, campId)
            ? prev.filter(id => !idMatches(id, campId))
            : [...prev, campId];
          localStorage.setItem('favoriteCamps', JSON.stringify(newFavorites));
          return newFavorites;
        });
      };

      const toggleCompare = (campId) => {
        setCompareList(prev => {
          if (listHasId(prev, campId)) {
            return prev.filter(id => !idMatches(id, campId));
          }
          if (prev.length >= 3) {
            alert('You can compare up to 3 camps at a time');
            return prev;
          }
          return [...prev, campId];
        });
      };

      const shareCamp = (camp, method) => {
        const url = `${window.location.origin}?camp=${camp.id}`;
        const text = `Check out ${camp.name} - ${camp.county}`;
        
        if (method === 'whatsapp') {
          window.open(`https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`, '_blank');
        } else if (method === 'email') {
          window.location.href = `mailto:?subject=${encodeURIComponent(camp.name)}&body=${encodeURIComponent(text + '\n\n' + url)}`;
        } else if (method === 'copy') {
          navigator.clipboard.writeText(url);
          alert('Link copied to clipboard!');
        }
        setShowShareModal(false);
      };

      const submitCamp = async (formData) => {
        const { hostname, origin, port } = window.location;
        const localFlask =
          (hostname === 'localhost' || hostname === '127.0.0.1') && port === '5000';
        const submissionsBase = localFlask || origin === CAMPS_DB_API_ORIGIN ? origin : CAMPS_DB_API_ORIGIN;
        try {
          const response = await fetch(`${submissionsBase}/api/submissions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          
          if (response.ok) {
            setSubmitSuccess(true);
            setTimeout(() => {
              setShowSubmitModal(false);
              setSubmitSuccess(false);
            }, 3000);
          } else {
            alert('Submission failed. Please try again.');
          }
        } catch (error) {
          alert('Error submitting camp: ' + error.message);
        }
      };

      const compareCamps = useMemo(() => {
        return camps.filter(camp => listHasId(compareList, camp.id));
      }, [compareList, camps]);

      if (loading) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>☀️</div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '2rem',
                color: '#FF6B35'
              }}>
                Loading camps...
              </h2>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontFamily: '"Nunito", sans-serif',
            padding: '20px'
          }}>
            <div style={{
              background: 'white',
              borderRadius: '25px',
              padding: '40px',
              border: '4px solid #FF6B6B',
              textAlign: 'center',
              maxWidth: '500px'
            }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>😕</div>
              <h2 style={{
                fontFamily: '"Fredoka One", cursive',
                fontSize: '1.8rem',
                color: '#2D3142',
                margin: '0 0 10px 0'
              }}>
                Oops! Something went wrong
              </h2>
              <p style={{ color: '#666', fontSize: '1rem' }}>{error}</p>
            </div>
          </div>
        );
      }

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #FFF5E1 0%, #FFE4B5 50%, #FFDAB9 100%)',
          fontFamily: '"Nunito", sans-serif',
          padding: '20px'
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
            
            @keyframes float {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-10px); }
            }
            
            @keyframes slideIn {
              from { opacity: 0; transform: translateY(20px); }
              to { opacity: 1; transform: translateY(0); }
            }
            
            .camp-card {
              animation: slideIn 0.5s ease-out forwards;
              opacity: 0;
            }
            
            .camp-card:nth-child(1) { animation-delay: 0.05s; }
            .camp-card:nth-child(2) { animation-delay: 0.1s; }
            .camp-card:nth-child(3) { animation-delay: 0.15s; }
            .camp-card:nth-child(4) { animation-delay: 0.2s; }
            .camp-card:nth-child(5) { animation-delay: 0.25s; }
            .camp-card:nth-child(6) { animation-delay: 0.3s; }
          `}</style>

          {/* Header */}
          <div style={{
            textAlign: 'center',
            marginBottom: '40px'
          }}>
            <h1 style={{
              fontFamily: '"Fredoka One", cursive',
              fontSize: 'clamp(2rem, 8vw, 4rem)',
              color: '#FF6B35',
              margin: '0 0 10px 0',
              textShadow: '4px 4px 0 #FFD93D, 8px 8px 0 rgba(0,0,0,0.1)',
              letterSpacing: '2px'
            }}>
              ☀️ Irish Summer Camps
            </h1>
            <p style={{
              fontSize: 'clamp(1rem, 3vw, 1.3rem)',
              color: '#2D3142',
              fontWeight: '600',
              margin: '0 0 20px 0'
            }}>
              Find the perfect adventure for your child! 🎪
            </p>

            {/* View Toggle + Submit Button */}
            <div style={{
              display: 'flex',
              justifyContent: 'center',
              gap: '10px',
              flexWrap: 'wrap',
              marginBottom: '20px'
            }}>
              <button
                onClick={() => setViewMode('browse')}
                style={{
                  padding: '12px 24px',
                  backgroundColor: viewMode === 'browse' ? '#FF6B35' : 'white',
                  color: viewMode === 'browse' ? 'white' : '#FF6B35',
                  border: '3px solid #FF6B35',
                  borderRadius: '15px',
                  fontSize: '1rem',
                  fontWeight: '700',
                  cursor: 'pointer',
                  fontFamily: 'inherit'
                }}
              >
                🔍 Browse Camps
              </button>
              <button
                onClick={() => setViewMode('favorites')}
                style={{
                  padding: '12px 24px',
                  backgroundColor: viewMode === 'favorites' ? '#FF6B35' : 'white',
                  color: viewMode === 'favorites' ? 'white' : '#FF6B35',
                  border: '3px solid #FF6B35',
                  borderRadius: '15px',
                  fontSize: '1rem',
                  fontWeight: '700',
                  cursor: 'pointer',
                  fontFamily: 'inherit',
                  position: 'relative'
                }}
              >
                ❤️ Saved ({favorites.length})
              </button>
              {compareList.length > 0 && (
                <button
                  onClick={() => setViewMode('compare')}
                  style={{
                    padding: '12px 24px',
                    backgroundColor: viewMode === 'compare' ? '#FF6B35' : 'white',
                    color: viewMode === 'compare' ? 'white' : '#FF6B35',
                    border: '3px solid #FF6B35',
                    borderRadius: '15px',
                    fontSize: '1rem',
                    fontWeight: '700',
                    cursor: 'pointer',
                    fontFamily: 'inherit'
                  }}
                >
                  ⚖️ Compare ({compareList.length})
                </button>
              )}
            </div>

            <button
              onClick={() => setShowSubmitModal(true)}
              style={{
                padding: '14px 28px',
                backgroundColor: '#4CAF50',
                color: 'white',
                border: 'none',
                borderRadius: '15px',
                fontSize: '1.1rem',
                fontWeight: '700',
                cursor: 'pointer',
                fontFamily: 'inherit',
                boxShadow: '0 4px 15px rgba(76, 175, 80, 0.3)',
                display: 'inline-flex',
                alignItems: 'center',
                gap: '8px'
              }}
            >
              <Plus size={20} />
              Submit Your Camp
            </button>
          </div>

          {/* Compare View */}
          {viewMode === 'compare' && compareList.length > 0 && (
            compareCamps.length > 0 ? (
            <div style={{
              maxWidth: '1400px',
              margin: '0 auto 40px',
              background: 'white',
              borderRadius: '25px',
              padding: '30px',

<!-- AI Chat JavaScript -->
<script>
  const chatButton = document.getElementById('ai-chat-button');
  const chatModal = document.getElementById('ai-chat-modal');
  const closeChat = document.getElementById('close-chat');
  const chatInput = document.getElementById('chat-input');
  const sendButton = document.getElementById('send-chat');
  const chatMessages = document.getElementById('chat-messages');
  const CHAT_API_ORIGIN = (window.location.hostname === 'irishsummercamps.ie' || window.location.hostname === 'www.irishsummercamps.ie')
    ? 'https://www.irishsummercamps.ie'
    : 'https://web-production-d5e24.up.railway.app';

  let isChatOpen = false;
  let conversationHistory = []; // {role: 'user'|'assistant', content: string}

  // Toggle chat
  chatButton.addEventListener('click', () => {
    isChatOpen = !isChatOpen;
    chatModal.style.display = isChatOpen ? 'flex' : 'none';
    if (isChatOpen) {
      chatInput.focus();
    }
  });

  closeChat.addEventListener('click', () => {
    isChatOpen = false;
    chatModal.style.display = 'none';
  });

  // Add message to chat
  function addMessage(text, isUser = false) {
    const messageDiv = document.createElement('div');
    messageDiv.style.cssText = `
      padding: 15px;
      border-radius: 15px;
      max-width: 85%;
      ${isUser ? `
        background: #FF6B35;
        color: white;
        align-self: flex-end;
        margin-left: auto;
      ` : `
        background: #FFF5E1;
        border: 2px solid #FFD93D;
        color: #2D3142;
      `}
    `;
    messageDiv.innerHTML = `<p style="margin: 0; font-size: 0.95rem; line-height: 1.5;">${text}</p>`;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // Add loading indicator
  function addLoading() {
    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'loading-indicator';
    loadingDiv.style.cssText = `
      padding: 15px;
      border-radius: 15px;
      background: #FFF5E1;
      border: 2px solid #FFD93D;
      max-width: 85%;
    `;
    loadingDiv.innerHTML = `
      <p style="margin: 0; color: #2D3142; font-size: 0.95rem;">
        <span style="animation: pulse 1.5s ease-in-out infinite;">🤔 Thinking...</span>
      </p>
    `;
    chatMessages.appendChild(loadingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeLoading() {
    const loading = document.getElementById('loading-indicator');
    if (loading) loading.remove();
  }

  // Send message
  async function sendMessage() {
    const question = chatInput.value.trim();
    if (!question) return;

    addMessage(question, true);
    chatInput.value = '';
    addLoading();

    // Snapshot history before adding the new turn (backend builds its own messages array)
    const historySnapshot = conversationHistory.slice();

    try {
      const { hostname, origin, port } = window.location;
      const localFlask =
        (hostname === 'localhost' || hostname === '127.0.0.1') && port === '5000';
      const aiBase = (localFlask || origin === CHAT_API_ORIGIN) ? origin : CHAT_API_ORIGIN;

      const response = await fetch(`${aiBase}/api/ai-concierge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: historySnapshot })
      });

      const data = await response.json();
      removeLoading();

      if (response.ok && data.success) {
        const formattedResponse = data.response.replace(/\n/g, '<br>');
        addMessage(formattedResponse, false);

        // Store this turn in conversation history
        conversationHistory.push({ role: 'user', content: question });
        conversationHistory.push({ role: 'assistant', content: data.response });
        // Keep history to last 20 turns to avoid token overflow
        if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);

        // Apply page filters if AI returned hints
        if (data.filterHints && Object.keys(data.filterHints).length > 0) {
          if (typeof window.__aiSetFilters === 'function') {
            window.__aiSetFilters(data.filterHints);
            const county = data.filterHints.county;
            const search = data.filterHints.searchTerm;
            const label = [county, search].filter(Boolean).join(' · ') || 'your query';
            addFilterPill(`🔍 Page filtered for: ${label}`);
          }
        }
      } else {
        const msg = data.error || 'Sorry, I had trouble processing that. Try asking differently!';
        addMessage(msg, false);
      }
    } catch (error) {
      removeLoading();
      addMessage('Oops! Something went wrong. Please try again.', false);
      console.error('Chat error:', error);
    }
  }

  function addFilterPill(text) {
    const pill = document.createElement('div');
    pill.style.cssText = `
      background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      align-self: center;
      cursor: pointer;
    `;
    pill.title = 'Click to clear AI filters';
    pill.textContent = text;
    pill.onclick = () => {
      if (typeof window.__aiSetFilters === 'function') {
        window.__aiSetFilters({ county: null, searchTerm: '', minAge: null, maxPrice: null });
      }
      pill.remove();
    };
    chatMessages.appendChild(pill);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // Event listeners
  sendButton.addEventListener('click', sendMessage);
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // Add pulse animation for loading
  const style = document.createElement('style');
  style.textContent = `
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  `;
  document.head.appendChild(style);
</script>
